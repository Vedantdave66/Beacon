spring:
  application:
    name: beacon
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      max-retries: 0
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        temperature: 0.1
    retry:
      max-attempts: 1

job-feed:
  schedule: ${JOB_FEED_SCHEDULE:0 0 6 * * *}
  time-zone: ${JOB_FEED_TIME_ZONE:America/Toronto}
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:ca}
    query: ${ADZUNA_QUERY:software developer}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
