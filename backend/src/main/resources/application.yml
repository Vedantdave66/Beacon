spring:
  application:
    name: job-copilot
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/jobcopilot}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

job-feed:
  schedule: ${JOB_FEED_SCHEDULE:0 0 6 * * *}
  time-zone: ${JOB_FEED_TIME_ZONE:America/Toronto}
  adzuna:
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    country: ${ADZUNA_COUNTRY:ca}
    query: ${ADZUNA_QUERY:software developer}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
